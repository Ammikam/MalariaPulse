[project]
name = "malariapulse"
version = "0.1.0"
description = "Multi-agent malaria early-warning decision support using MCP, with human-in-the-loop review"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "mcp>=1.9,<2",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
llm = ["google-genai>=1.0"]
app = ["streamlit>=1.35"]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
